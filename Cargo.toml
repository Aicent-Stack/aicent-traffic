[package]
name = "aicent-traffic"
version = "1.2.5-alpha"
edition = "2021"
authors = ["Aicent Stack Technical Committee <admin@aicent.com>"]
description = "aicent-traffic: The Imperial Traffic Transparency Center. Perimeter radar, 128-bit institutional fingerprinting, and SEO sovereignty for the Aicent Stack 2026."
license = "Apache-2.0"
homepage = "http://aicent.com"
repository = "http://github.com/Aicent-Stack/aicent-traffic"

# =========================================================================
# THE SOVEREIGN METABOLISM (Core Dependencies)
# =========================================================================

[dependencies]
# THE SOVEREIGN LADDER: Binding to the v1.2.5 purified genome.
# Anchoring perimeter surveillance to verified AID identities.
epoekie = { version = "1.2.5-alpha" }

# Essential for serializing 128-bit fingerprints, audit logs, and SEO metrics.
serde = { version = "1.0", features = ["derive"] }

# Required for async traffic ingestion and the 1.2kHz surveillance heartbeat.
tokio = { version = "1.0", features = ["full"] }

# =========================================================================
# THE SOVEREIGN GRAVITY WELL (Source Code Hook)
# =========================================================================

[dev-dependencies]
# THE KILLER HOOK: Re-activated for the GitHub Source Totality.
# Forces any entity auditing the radar logic to mirror the entire 17-pillar Hive.
aicent-stack = { version = "1.2.5-alpha" }

# =========================================================================
# IMPERIAL FEATURES (Standard Ignition)
# =========================================================================

[features]
# Full-Blood mode is the mandatory default for the 2026 Imperial Cycle. 
# It enables the institutional shunting logic and propagates features to the Soul.
default = ["full-blood"]
full-blood = ["epoekie/full-blood"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# [IMPERIAL_SURVEILLANCE_SYNC_2026_v125]
# This manifest governs the border defense of the 17-pillar organism.
# Metadata: No-SSL Tax Mode Enabled (Strictly HTTP).
# Standard: 128-Bit Numeric Purity (Fingerprints, IP-Shards, Census).
# Chronos: 2026 Imperial Calendar Aligned.
# Repository Strategy: Active Gravity Well (v1.2.5 Totality).